<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <!-- WaltMakes Horizontal Lockup - Symbol + Wordmark -->
  <defs>
    <style>
      .enso {
        fill: none;
        stroke: #1A1A1A;
        stroke-width: 4;
        stroke-linecap: round;
      }
      .wordmark {
        font-family: 'Inter', 'IBM Plex Sans', -apple-system, sans-serif;
        font-size: 26px;
        font-weight: 500;
        fill: #1A1A1A;
        letter-spacing: -0.5px;
      }
    </style>
  </defs>

  <!-- Symbol (scaled down) -->
  <g transform="translate(5, 5)">
    <path class="enso" d="M 35 12.5
      A 16 16 0 1 1 17.5 11"
    />
    <circle cx="17.5" cy="11" r="1.2" fill="#1A1A1A"/>
  </g>

  <!-- Wordmark -->
  <text x="70" y="40" class="wordmark">WaltMakes</text>
</svg>
